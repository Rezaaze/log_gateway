name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --locked 2>&1

      - name: Build release binary
        run: cargo build --release --locked

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with components
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit (prebuilt binary via binstall)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: Run security audit
        run: cargo audit

  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-24.04-arm  # native ARM64 runner — no QEMU, fast Rust builds
    needs: [test, lint, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image (linux/arm64 native)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "167.235.30.106" >> ~/.ssh/known_hosts

      - name: Copy config files to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            root@167.235.30.106:/root/log-gateway/docker-compose.prod.yml

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@167.235.30.106 \
            "mkdir -p /root/log-gateway/deploy/haproxy /root/log-gateway/tools"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/haproxy/haproxy.cfg \
            root@167.235.30.106:/root/log-gateway/deploy/haproxy/haproxy.cfg

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/prometheus.prod.yml \
            root@167.235.30.106:/root/log-gateway/deploy/prometheus.prod.yml

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            tools/wikipedia_stream.py \
            root@167.235.30.106:/root/log-gateway/tools/wikipedia_stream.py

      - name: Deploy cluster via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              root@167.235.30.106 \
              bash << 'ENDSSH'
            set -e

            # GHCR login und neues Image pullen (GITHUB_TOKEN hat packages:read)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/rezaaze/log_gateway:latest

            # Altes Image taggen (Rollback-Möglichkeit)
            docker tag ghcr.io/rezaaze/log_gateway:latest log-gateway:previous 2>/dev/null || true
            docker tag ghcr.io/rezaaze/log_gateway:latest log-gateway:latest

            # Cluster neu starten (nur geänderte Container werden neu gestartet)
            cd /root/log-gateway
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health-Check: alle 4 Gateway-Instanzen müssen healthy sein (max 60s)
            for i in $(seq 1 20); do
              HEALTHY=$(docker ps --filter "health=healthy" --format "{{.Names}}" | grep -c "^gateway_" || true)
              echo "Health check $i/20: $HEALTHY/4 gateway instances healthy"
              if [ "$HEALTHY" -ge 4 ]; then
                echo "All 4 gateway instances healthy — deployment successful!"
                docker image prune -f --filter "until=24h" 2>/dev/null || true
                exit 0
              fi
              sleep 3
            done

            echo "Health-Check failed after 60s"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 20 gateway_1
            exit 1
          ENDSSH
