[server]
host = "0.0.0.0"
port = 8080

[cache]
max_capacity = 10000
ttl_seconds = 300

[cost]
enabled = true

[metrics]
enabled = true

[sink]
enabled = true
output_dir = "data/logs"
max_buffer_size = 100
flush_interval_secs = 30
compress = false

[rate_limit]
enabled = true
requests_per_second = 1000

[s3]
enabled = false
# endpoint_url = "http://minio:9000"   # Auskommentiert für AWS
bucket = ""
region = "us-east-1"
prefix = "logs/"
access_key_id = ""
secret_access_key = ""
delete_after_upload = false

[clickhouse]
enabled = true
url = "http://clickhouse:8123"
database = "bgp"
table = "bgp_events"
batch_size = 5000
flush_interval_secs = 1

[rpki]
enabled = true
# Entweder die Basis-Adresse eines selbst gehosteten Validators (Dump unter
# /json), oder die volle URL eines oeffentlichen VRP-Feeds, die auf .json
# endet und dann unverändert verwendet wird.
#
# Ohne eigenen Server testbar mit dem oeffentlichen rpki-client-Feed:
#   routinator_url        = "https://rpki.cloudflare.com/rpki.json"
#   refresh_interval_secs = 3600
# Das ist ein ~100 MB Download pro Abruf von einem fremden Dienst — nicht
# haeufiger als stuendlich abfragen. Fuer den Dauerbetrieb einen eigenen
# Validator hosten.
routinator_url = "http://routinator:8323"
refresh_interval_secs = 600

[tls]
enabled = false
cert_path = "certs/cert.pem"
key_path  = "certs/key.pem"

[webhooks]
enabled = true

# Slack-Beispiel (auskommentiert):
# [[webhooks.targets]]
# target_type = "slack"
# url = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
# channel = "#bgp-alerts"

# Generic-Beispiel (auskommentiert):
# [[webhooks.targets]]
# target_type = "generic"
# url = "https://webhook.example.com/alert"
# [webhooks.targets.headers]
# X-API-Key = "secret"

[telemetry]
enabled = false
otlp_endpoint = "http://localhost:4317"
service_name = "log-gateway"

[loki]
enabled = false
endpoint = "http://localhost:3100"
service_name = "log-gateway"

[escalation]
auto_escalation_enabled = true
check_interval_secs = 60
timeout_secs = 300

[smtp]
enabled = false
host = "localhost"
port = 587
from = "gateway@localhost"
# to = ["admin@example.com"]

[nats]
# Enabled via GATEWAY__NATS__ENABLED env var in docker-compose.prod.yml
# URL uses docker-net hostname "nats" + BGP-account credentials (see deploy/nats/nats.conf)
enabled = false
url = "nats://bgp-stream:bgp-stream@nats:4222"
subject = "bgp.events"

[snapshot]
# Directory where baseline model snapshots are stored
dir = "/data/snapshots"
# Number of days to keep snapshots (older files are deleted)
retention_days = 7

[wave]
# Enable the wave-physics propagation anomaly detector (PropagationAggregator
# + WaveAnomalyDetector). Safe to leave enabled without a baseline file —
# it degrades to "no anomalies" until one is built via tools/baseline_builder.
enabled = true
# Path to the baseline file produced by tools/baseline_builder
baseline_path = "data/baselines/baseline.bin.zst"
