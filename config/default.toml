[server]
host = "0.0.0.0"
port = 8080

[cache]
max_capacity = 10000
ttl_seconds = 300

[cost]
enabled = true

[metrics]
enabled = true

[sink]
enabled = true
output_dir = "data/logs"
max_buffer_size = 100
flush_interval_secs = 30
compress = false

[rate_limit]
enabled = true
requests_per_second = 1000

[s3]
enabled = false
# endpoint_url = "http://minio:9000"   # Auskommentiert für AWS
bucket = ""
region = "us-east-1"
prefix = "logs/"
access_key_id = ""
secret_access_key = ""
delete_after_upload = false

[clickhouse]
enabled = false
url = "http://clickhouse:8123"
database = "bgp"
table = "bgp_events"
batch_size = 1000
flush_interval_secs = 5

[rpki]
enabled = true
routinator_url = "http://routinator:8323"

[tls]
enabled = false
cert_path = "certs/cert.pem"
key_path  = "certs/key.pem"

[webhooks]
enabled = true

# Slack-Beispiel (auskommentiert):
# [[webhooks.targets]]
# target_type = "slack"
# url = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
# channel = "#bgp-alerts"

# Generic-Beispiel (auskommentiert):
# [[webhooks.targets]]
# target_type = "generic"
# url = "https://webhook.example.com/alert"
# [webhooks.targets.headers]
# X-API-Key = "secret"

[telemetry]
enabled = false
otlp_endpoint = "http://localhost:4317"
service_name = "log-gateway"

[loki]
enabled = false
endpoint = "http://localhost:3100"
service_name = "log-gateway"

[escalation]
auto_escalation_enabled = true
check_interval_secs = 60
timeout_secs = 300

[smtp]
enabled = false
host = "localhost"
port = 587
from = "gateway@localhost"
# to = ["admin@example.com"]
