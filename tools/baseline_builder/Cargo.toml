[package]
name    = "baseline-builder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "baseline-builder"
path = "src/main.rs"

[dependencies]
log-gateway        = { path = "../.." }
bgpkit-parser      = "0.10"
serde_json         = "1"
clap               = { version = "4", features = ["derive"] }
rayon              = "1"
indicatif          = "0.17"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
walkdir            = "2"
