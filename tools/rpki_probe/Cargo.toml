[package]
name    = "rpki-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rpki-probe"
path = "src/main.rs"

[dependencies]
log-gateway = { path = "../.." }
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest     = { version = "0.12", features = ["stream"], default-features = false }
futures-util = "0.3"
serde_json  = "1"
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
