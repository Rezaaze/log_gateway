[package]
name    = "asn-report"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "asn-report"
path = "src/main.rs"

[dependencies]
log-gateway = { path = "../.." }
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest     = { version = "0.12", features = ["json"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
chrono      = "0.4"
