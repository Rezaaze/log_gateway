[package]
name = "bgp-stream"
version = "0.1.0"
edition = "2021"
description = "RIPE NCC RIS Live BGP stream → Log Gateway (Rust rewrite)"

[[bin]]
name = "bgp-stream"
path = "src/main.rs"

[dependencies]
# Shared types from the gateway crate
log-gateway = { path = "../.." }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket (TLS-capable, builds on tokio-tungstenite)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# HTTP client with connection pooling / keep-alive
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lock-free MPMC channel
crossbeam-channel = "0.5"

# JWT (shared with gateway)
jsonwebtoken = "9"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Futures utilities (StreamExt, SinkExt — re-exported by tokio-tungstenite)
futures-util = "0.3"

# Fast random number (sampling)
fastrand = "2"

# [profile.*] is defined in the workspace root Cargo.toml
