[package]
name    = "mrt-replay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mrt-replay"
path = "src/main.rs"

[dependencies]
bgpkit-parser = "0.10"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
clap          = { version = "4", features = ["derive"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }