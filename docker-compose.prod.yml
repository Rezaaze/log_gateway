# ── Log Gateway — Production Cluster (4-Zylinder Setup) ──────────────────────
#
# Architektur:
#   Internet
#     └─ HAProxy :8090  (Load Balancer, leastconn)
#          ├─ gateway_1 :8080  (vCPU 0)
#          ├─ gateway_2 :8080  (vCPU 1)
#          ├─ gateway_3 :8080  (vCPU 2)
#          └─ gateway_4 :8080  (vCPU 3)
#
# HAProxy Stats Dashboard: http://server:8404/stats
#
# Netzwerk: Nur HAProxy ist nach außen erreichbar (Port 8090).
#           Gateways sind ausschließlich über das interne "gateway-net" erreichbar.
#
# Starten:   docker compose -f docker-compose.prod.yml up -d
# Neu bauen: docker compose -f docker-compose.prod.yml build
# Logs:      docker compose -f docker-compose.prod.yml logs -f gateway_1
# Rollback:  ./deploy-cluster.sh --rollback
# ─────────────────────────────────────────────────────────────────────────────

# ── Secrets ──────────────────────────────────────────────────────────────────
secrets:
  gateway_api_key:
    file: ./secrets/gateway_api_key.txt
  gateway_jwt_secret:
    file: ./secrets/gateway_jwt_secret.txt

# ── Gemeinsame Umgebungsvariablen (YAML-Anker) ───────────────────────────────
x-gateway-env: &gateway-env
  RUST_LOG: "info"
  GATEWAY__SERVER__HOST: "0.0.0.0"
  GATEWAY__SERVER__PORT: "8080"
  GATEWAY__SINK__OUTPUT_DIR: "/app/data/logs"
  GATEWAY__RATE_LIMIT__REQUESTS_PER_SECOND: "20000"   # Pro Instanz; 4×20k = 80k gesamt
  GATEWAY__S3__ENABLED: "false"
  GATEWAY__S3__ENDPOINT_URL: "http://minio:9000"
  GATEWAY__S3__BUCKET: "log-gateway"
  GATEWAY__S3__REGION: "us-east-1"
  GATEWAY__S3__PREFIX: "logs/"
  GATEWAY__S3__ACCESS_KEY_ID: "minioadmin"
  GATEWAY__S3__SECRET_ACCESS_KEY: "minioadmin"
  GATEWAY__S3__DELETE_AFTER_UPLOAD: "false"

# ── Gemeinsame Volumes (YAML-Anker) ──────────────────────────────────────────
x-gateway-volumes: &gateway-volumes
  - ./data/logs:/app/data/logs       # Shared Log-Sink
  - ./certs:/app/certs:ro            # TLS-Zertifikate (read-only)
  - ./config:/app/config:ro          # Gateway-Config (read-only)

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Gateway Instanz 1 — vCPU 0 ─────────────────────────────────────────────
  gateway_1:
    image: log-gateway:latest
    container_name: gateway_1
    cpuset: "0"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "1"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    depends_on:
      - clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Gateway Instanz 2 — vCPU 1 ─────────────────────────────────────────────
  gateway_2:
    image: log-gateway:latest
    container_name: gateway_2
    cpuset: "1"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "2"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    depends_on:
      - clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Gateway Instanz 3 — vCPU 2 ─────────────────────────────────────────────
  gateway_3:
    image: log-gateway:latest
    container_name: gateway_3
    cpuset: "2"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "3"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    depends_on:
      - clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Gateway Instanz 4 — vCPU 3 ─────────────────────────────────────────────
  gateway_4:
    image: log-gateway:latest
    container_name: gateway_4
    cpuset: "3"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "4"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    depends_on:
      - clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── HAProxy Load Balancer ────────────────────────────────────────────────────
  haproxy:
    image: haproxy:3.0-alpine
    container_name: haproxy-lb
    ports:
      - "8090:8090"                  # Einziger nach außen offener Port
      - "8404:8404"                  # HAProxy Stats Dashboard
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - gateway-net
    depends_on:
      gateway_1:
        condition: service_healthy
      gateway_2:
        condition: service_healthy
      gateway_3:
        condition: service_healthy
      gateway_4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9002:9001"   # 9001 auf Server belegt → externe Port 9002
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alertmanager:/etc/prometheus/alertmanager:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3001:3000"   # 3000 auf Server belegt → externe Port 3001
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/gateway.json"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gateway-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── BGP Stream (Rust) — RIPE NCC RIS Live → Gateway ────────────────────────
  # Verbindet sich mit wss://ris-live.ripe.net/v1/ws/, empfängt alle BGP
  # UPDATE-Events (ANNOUNCE + WITHDRAW) und sendet sie gebündelt ans Gateway.
  # WICHTIG: /etc/hosts auf dem Host muss enthalten: 193.0.11.16 ris-live.ripe.net
  #          (extra_hosts funktioniert NICHT mit network_mode: host)
  #
  # Starten:  docker compose -f docker-compose.prod.yml up -d bgp-stream
  # Stoppen:  docker compose -f docker-compose.prod.yml stop bgp-stream
  # Logs:     docker compose -f docker-compose.prod.yml logs -f bgp-stream
  bgp-stream:
    image: ghcr.io/rezaaze/log_gateway/bgp-stream:latest
    container_name: bgp-stream
    environment:
      GATEWAY_URL:       "http://127.0.0.1:8090"      # host-network: HAProxy direkt
      WORKERS:           "8"
      BATCH_SIZE:        "100"
      BATCH_TIMEOUT_MS:  "20"
      TENANT_ID:         "bgp"
      SAMPLE_RATE:       "1.0"
      CHANNEL_CAP:       "64000"
      RUST_LOG:          "warn"
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    network_mode: host                                 # Outbound HTTPS via Host-Stack
    depends_on:
      haproxy:
        condition: service_healthy
    restart: unless-stopped

  # ── ClickHouse ──────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # HTTP API (localhost only)
      # Note: Native TCP port 9000 is internal only (not exposed to host)
      #       Grafana uses HTTP API (port 8123) instead of native protocol
    environment:
      CLICKHOUSE_DB: bgp
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/clickhouse/alert_rules_schema.sql:/docker-entrypoint-initdb.d/02_alert_rules.sql:ro
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'SHOW TABLES FROM bgp FORMAT JSONCompact' | clickhouse-client 2>&1 | grep -q 'Ok\\|alert_rules' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── Routinator (RPKI Validation) ────────────────────────────────────────────
  routinator:
    image: nlnetlabs/routinator:latest
    container_name: routinator
    ports:
      - "8323:8323"   # HTTP API (ROA-Liste als JSON)
    volumes:
      - routinator-data:/home/routinator/.rpki-cache
    networks:
      - gateway-net
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8323/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # ── Alertmanager ────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      - SLACK_WEBHOOK_CRITICAL=${SLACK_WEBHOOK_CRITICAL:-https://hooks.slack.com/services/PLACEHOLDER/CRITICAL}
      - SLACK_WEBHOOK_WARNING=${SLACK_WEBHOOK_WARNING:-https://hooks.slack.com/services/PLACEHOLDER/WARNING}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"
    networks:
      - gateway-net
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  prometheus-data:
  grafana-data:
  minio-data:
  clickhouse-data:
  clickhouse-logs:
  routinator-data:

# ── Netzwerke ─────────────────────────────────────────────────────────────────
networks:
  gateway-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
