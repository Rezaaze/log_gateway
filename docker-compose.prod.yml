# ── Log Gateway — Production Cluster (4-Zylinder Setup) ──────────────────────
#
# Architektur:
#   Internet
#     └─ HAProxy :8090  (Load Balancer, leastconn)
#          ├─ gateway_1 :8080  (vCPU 0)
#          ├─ gateway_2 :8080  (vCPU 1)
#          ├─ gateway_3 :8080  (vCPU 2)
#          └─ gateway_4 :8080  (vCPU 3)
#
# HAProxy Stats Dashboard: http://server:8404/stats
#
# Netzwerk: Nur HAProxy ist nach außen erreichbar (Port 8090).
#           Gateways sind ausschließlich über das interne "gateway-net" erreichbar.
#
# Starten:   docker compose -f docker-compose.prod.yml up -d
# Neu bauen: docker compose -f docker-compose.prod.yml build
# Logs:      docker compose -f docker-compose.prod.yml logs -f gateway_1
# Rollback:  ./deploy-cluster.sh --rollback
# ─────────────────────────────────────────────────────────────────────────────

# ── Secrets ──────────────────────────────────────────────────────────────────
secrets:
  gateway_api_key:
    file: ./secrets/gateway_api_key.txt
  gateway_jwt_secret:
    file: ./secrets/gateway_jwt_secret.txt

# ── Gemeinsame Umgebungsvariablen (YAML-Anker) ───────────────────────────────
x-gateway-env: &gateway-env
  RUST_LOG: "info"
  GATEWAY__SERVER__HOST: "0.0.0.0"
  GATEWAY__SERVER__PORT: "8080"
  GATEWAY__SINK__OUTPUT_DIR: "/app/data/logs"
  GATEWAY__RATE_LIMIT__REQUESTS_PER_SECOND: "20000"   # Pro Instanz; 4×20k = 80k gesamt
  GATEWAY__S3__ENABLED: "false"
  GATEWAY__S3__ENDPOINT_URL: "http://minio:9000"
  GATEWAY__S3__BUCKET: "log-gateway"
  GATEWAY__S3__REGION: "us-east-1"
  GATEWAY__S3__PREFIX: "logs/"
  GATEWAY__S3__ACCESS_KEY_ID: "minioadmin"
  GATEWAY__S3__SECRET_ACCESS_KEY: "minioadmin"
  GATEWAY__S3__DELETE_AFTER_UPLOAD: "false"

# ── Gemeinsame Volumes (YAML-Anker) ──────────────────────────────────────────
x-gateway-volumes: &gateway-volumes
  - ./data/logs:/app/data/logs       # Shared Log-Sink
  - ./certs:/app/certs:ro            # TLS-Zertifikate (read-only)
  - ./config:/app/config:ro          # Gateway-Config (read-only)

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Gateway Instanz 1 — vCPU 0 ─────────────────────────────────────────────
  gateway_1:
    image: log-gateway:latest
    container_name: gateway_1
    cpuset: "0"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "1"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Gateway Instanz 2 — vCPU 1 ─────────────────────────────────────────────
  gateway_2:
    image: log-gateway:latest
    container_name: gateway_2
    cpuset: "1"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "2"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Gateway Instanz 3 — vCPU 2 ─────────────────────────────────────────────
  gateway_3:
    image: log-gateway:latest
    container_name: gateway_3
    cpuset: "2"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "3"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Gateway Instanz 4 — vCPU 3 ─────────────────────────────────────────────
  gateway_4:
    image: log-gateway:latest
    container_name: gateway_4
    cpuset: "3"
    environment:
      <<: *gateway-env
      INSTANCE_ID: "4"
    volumes: *gateway-volumes
    secrets:
      - gateway_api_key
      - gateway_jwt_secret
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── HAProxy Load Balancer ────────────────────────────────────────────────────
  haproxy:
    image: haproxy:3.0-alpine
    container_name: haproxy-lb
    ports:
      - "8090:8090"                  # Einziger nach außen offener Port
      - "8404:8404"                  # HAProxy Stats Dashboard
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - gateway-net
    depends_on:
      gateway_1:
        condition: service_healthy
      gateway_2:
        condition: service_healthy
      gateway_3:
        condition: service_healthy
      gateway_4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8404/stats"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alertmanager:/etc/prometheus/alertmanager:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/gateway.json"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gateway-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Wikipedia Stream — Dauerstresstest mit echten Weltdaten ─────────────────
  # Abonniert den Wikipedia Recent-Changes SSE-Stream und schickt jeden Edit
  # als Log-Event ans Gateway. Kostenlos, kein API-Key nötig.
  #
  # Starten:  docker compose -f docker-compose.prod.yml up -d wikipedia-stream
  # Stoppen:  docker compose -f docker-compose.prod.yml stop wikipedia-stream
  # Logs:     docker compose -f docker-compose.prod.yml logs -f wikipedia-stream
  wikipedia-stream:
    image: python:3.12-alpine
    container_name: wikipedia-stream
    working_dir: /app
    volumes:
      - ./tools:/app/tools:ro
    environment:
      GATEWAY_URL:      "http://haproxy-lb:8090"  # Über HAProxy → alle 4 Instanzen
      GATEWAY_API_KEY:  ""                          # Leer = kein Auth
      WORKERS:          "4"                         # 4 parallele HTTP-Sender
      TENANT_ID:        "wikipedia"
    command: python3 tools/wikipedia_stream.py
    networks:
      - gateway-net
    depends_on:
      haproxy:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - stress                                      # Nur mit: --profile stress

  # ── Alertmanager ────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      - SLACK_WEBHOOK_CRITICAL=${SLACK_WEBHOOK_CRITICAL:-https://hooks.slack.com/services/PLACEHOLDER/CRITICAL}
      - SLACK_WEBHOOK_WARNING=${SLACK_WEBHOOK_WARNING:-https://hooks.slack.com/services/PLACEHOLDER/WARNING}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"
    networks:
      - gateway-net
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  prometheus-data:
  grafana-data:
  minio-data:

# ── Netzwerke ─────────────────────────────────────────────────────────────────
networks:
  gateway-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
