[workspace]
members = ["."]
resolver = "2"

[package]
name = "log-gateway"
version = "0.1.0"
edition = "2021"

[features]
# Enable tokio-console subscriber for async task profiling
# Build with: RUSTFLAGS="--cfg tokio_unstable" cargo run --features tokio-console
tokio-console = ["dep:console-subscriber"]

[dependencies]
axum = { version = "0.7", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time", "registry"] }
tracing-opentelemetry = "0.28"
tracing-loki = { version = "0.2", features = ["compat-0-2-1"] }
tower = "0.4"
url = "2"
tower-http = { version = "0.5", features = ["trace", "compression-gzip"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
regex = "1"
once_cell = "1"
moka = { version = "0.12", features = ["sync"] }
sha2 = "0.10"
hex = "0.4"
dashmap = "6"
prometheus-client = "0.22"
governor = { version = "0.6", features = ["dashmap"] }
mimalloc = { version = "0.1", default-features = false }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
tokio-util = { version = "0.7", features = ["io"] }
zstd = "0.13"
jsonschema = { version = "0.18", default-features = false }
jsonwebtoken = "9"
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
crossbeam = { version = "0.8", features = ["crossbeam-queue"] }
console-subscriber = { version = "0.4", optional = true }
reqwest = { version = "0.12", features = ["json"], default-features = false }
ipnet = { version = "2", features = ["serde"] }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace"] }
opentelemetry-semantic-conventions = "0.27"
async-nats = "0.34"
prometheus = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
glob = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum-test = "15"
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"], default-features = false }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
toml = "0.8"

[[bench]]
name = "gateway_benchmarks"
path = "benches/gateway_benchmarks.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

# Profiling: optimized wie release, aber mit Debug-Symbolen für flamegraph
# cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
