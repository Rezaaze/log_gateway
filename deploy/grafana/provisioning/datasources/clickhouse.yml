apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    orgId: 1
    access: proxy
    url: http://clickhouse:8123
    isDefault: false
    editable: false
    jsonData:
      server: clickhouse
      port: 9000
      username: default
      defaultDatabase: bgp
      tlsSkipVerify: true
    secureJsonData:
      password: ""