# ── HAProxy Load Balancer — Log Gateway Cluster ───────────────────────────────
#
# Topology:
#   Internet → HAProxy:8090 → [gateway_1:8080, gateway_2:8080, gateway_3:8080, gateway_4:8080]
#
# Vorteile gegenüber Nginx:
#   - Reiner Load Balancer — kein Web-Server-Overhead
#   - leastconn: Requests zur Instanz mit wenigsten aktiven Verbindungen
#   - Aktive Health Checks ohne extra Konfiguration
#   - HAProxy Stats Dashboard auf Port 8404
#   - ~20-30% weniger Latenz als Nginx für reines Proxying
#
# ─────────────────────────────────────────────────────────────────────────────

global
    log         stdout format raw local0 info
    maxconn     50000               # Max gleichzeitige Verbindungen
    nbthread    4                   # 1 Thread pro vCPU (passt zum 4-Zylinder Setup)
    cpu-map     1/1-4 0-3          # Thread-zu-CPU Pinning (wie cpuset im Gateway)

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull         # Keine Logs für Health-Check-Requests
    option      forwardfor          # X-Forwarded-For Header setzen
    option      http-server-close   # Verbindungen nach Response schließen (spart FDs)
    timeout connect  2s             # Max Wartezeit für Verbindungsaufbau zum Backend
    timeout client   30s            # Max Wartezeit auf Client-Daten
    timeout server   30s            # Max Wartezeit auf Backend-Antwort
    timeout http-keep-alive 65s     # Keepalive-Timeout (passt zu Gateway)

# ── Stats Dashboard ───────────────────────────────────────────────────────────
# Erreichbar unter: http://server:8404/stats
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

# ── Frontend — eingehende Verbindungen ───────────────────────────────────────
frontend gateway_frontend
    bind *:8090
    default_backend gateway_cluster

    # Rate Limiting: max 500 Verbindungen pro Client-IP (Noisy-Neighbor-Schutz)
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(1s)
    tcp-request connection track-sc0 src
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 500 }

# ── Backend — 4 Gateway-Instanzen ────────────────────────────────────────────
backend gateway_cluster
    balance leastconn               # Neue Requests → Instanz mit wenigsten Verbindungen
                                    # Optimal für SaaS: viele Clients mit unterschiedlicher Last

    option  httpchk GET /health     # Aktiver Health Check — GET /health
    http-check expect status 200

    # Persistente Verbindungen zum Backend (eliminiert Handshake-Overhead)
    option  http-reuse aggressive   # Verbindungen aggressiv wiederverwenden

    server gateway_1 gateway_1:8080 check inter 5s fall 3 rise 2 maxconn 10000
    server gateway_2 gateway_2:8080 check inter 5s fall 3 rise 2 maxconn 10000
    server gateway_3 gateway_3:8080 check inter 5s fall 3 rise 2 maxconn 10000
    server gateway_4 gateway_4:8080 check inter 5s fall 3 rise 2 maxconn 10000
