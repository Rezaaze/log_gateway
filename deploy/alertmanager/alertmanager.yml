global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'   # Kein Slack konfiguriert — Alerts nur in UI sichtbar

receivers:
  - name: 'null'    # Null receiver: Alerts werden gesammelt aber nicht gesendet

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']