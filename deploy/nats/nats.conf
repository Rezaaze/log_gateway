# NATS Jetstream Configuration for log-gateway
# Production setup with persistent storage

# NATS Server Listening Port
port: 4222

# HTTP Monitoring Port
http_port: 8222

# Maximum payload size (16MB for large batches)
max_payload: 16MB

# Jetstream Configuration
jetstream {
  # Directory for storing Jetstream data
  store_dir: /data/jetstream

  # Memory store limits
  max_mem_store: 1G

  # File store limits (for persistence)
  max_file_store: 10G
}

# System account configuration
accounts {
  # System account for NATS management
  SYS: {
    users: [
      { user: sys, password: sys }
    ]
  }

  # BGP Events account
  BGP: {
    users: [
      { user: bgp-stream, password: bgp-stream }
    ]
    jetstream: enabled
  }
}

# Set system account
system_account: SYS
