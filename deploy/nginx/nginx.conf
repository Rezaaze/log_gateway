# ── Nginx Load Balancer — Log Gateway Cluster ────────────────────────────────
#
# Topology:
#   Internet → Nginx:8090 → [gateway_1:8080, gateway_2:8080, gateway_3:8080, gateway_4:8080]
#
# ip_hash:  Requests desselben Clients landen immer bei derselben Instanz.
#           Maximiert Cache-Hit-Rate pro Instanz (Shared-Nothing).
#
# keepalive: Hält 64 persistente TCP-Verbindungen pro Instanz offen.
#            Eliminiert TCP-Handshake-Overhead bei hohem Throughput.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;          # 1 Worker pro vCPU (4 auf Hetzner)
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;    # Max gleichzeitige Verbindungen pro Worker
    use epoll;                  # Linux epoll — effizienteste I/O-Methode
    multi_accept on;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    access_log  off;            # Deaktiviert für maximalen Throughput
    error_log   /var/log/nginx/error.log warn;

    # ── TCP-Optimierungen ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # ── Buffer-Tuning für JSON-Payloads ──────────────────────────────────────
    client_max_body_size    64k;    # Passt zum Gateway-Limit (65536 bytes)
    client_body_buffer_size 64k;
    proxy_buffer_size       8k;
    proxy_buffers           8 8k;

    # ── Upstream: 4 Gateway-Instanzen ────────────────────────────────────────
    upstream gateway_cluster {
        ip_hash;    # Gleiche Client-IP → gleiche Instanz → maximale Cache-Hits

        server gateway_1:8080 max_fails=3 fail_timeout=10s;
        server gateway_2:8080 max_fails=3 fail_timeout=10s;
        server gateway_3:8080 max_fails=3 fail_timeout=10s;
        server gateway_4:8080 max_fails=3 fail_timeout=10s;

        # Persistente Verbindungen zum Upstream (eliminiert Handshake-Overhead)
        keepalive 64;
    }

    # ── Server-Block ─────────────────────────────────────────────────────────
    server {
        listen 8090;
        server_name _;

        # ── Proxy-Header ─────────────────────────────────────────────────────
        proxy_http_version      1.1;
        proxy_set_header        Connection "";         # Keepalive zum Upstream
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout   2s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;

        # ── Log-Ingest Endpunkt ───────────────────────────────────────────────
        location /api/v1/logs {
            proxy_pass http://gateway_cluster;
        }

        # ── Alle anderen Endpunkte ────────────────────────────────────────────
        # (health, metrics, costs, cache/stats)
        location / {
            proxy_pass http://gateway_cluster;
        }

        # ── Nginx eigener Health-Endpunkt (für externe Monitore) ──────────────
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
