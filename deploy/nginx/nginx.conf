# ── Nginx Load Balancer — Log Gateway Cluster (SaaS Mode) ────────────────────
#
# Topology:
#   Internet → Nginx:8090 → [gateway_1:8080, gateway_2:8080, gateway_3:8080, gateway_4:8080]
#
# least_conn: Neue Requests gehen zur Instanz mit den wenigsten aktiven
#             Verbindungen. Optimal für viele verschiedene Clients (SaaS).
#
# rate limit: Pro Client-IP max 500 req/s mit Burst 1000.
#             Schützt vor einem Kunden der andere kaputt macht (Noisy Neighbor).
#
# gzip:       Komprimiert /metrics und JSON-Responses (60-70% weniger Traffic).
#
# keepalive:  256 persistente TCP-Verbindungen (64 pro Instanz).
#             Eliminiert TCP-Handshake-Overhead bei hohem Throughput.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;          # 1 Worker pro vCPU (4 auf Hetzner)
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;    # Max gleichzeitige Verbindungen pro Worker
    use epoll;                  # Linux epoll — effizienteste I/O-Methode
    multi_accept on;
}

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    access_log  off;            # Deaktiviert für maximalen Throughput
    error_log   /var/log/nginx/error.log warn;

    # ── TCP-Optimierungen ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # ── Gzip — spart 60-70% Traffic bei /metrics und JSON-Responses ──────────
    gzip                on;
    gzip_types          application/json text/plain application/x-www-form-urlencoded;
    gzip_min_length     1024;   # Nur komprimieren wenn > 1KB (kleine Payloads lohnen nicht)
    gzip_comp_level     4;      # Kompressionsgrad 1-9 (4 = gutes Speed/Ratio-Verhältnis)
    gzip_vary           on;     # Vary: Accept-Encoding Header setzen

    # ── Rate Limiting — Schutz vor Noisy-Neighbor-Effekt ─────────────────────
    # Jede Client-IP bekommt einen eigenen Bucket (10MB Zone = ~160k IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=500r/s;
    limit_req_status 429;       # HTTP 429 Too Many Requests (nicht 503)

    # ── Buffer-Tuning für JSON-Payloads ──────────────────────────────────────
    client_max_body_size    64k;    # Passt zum Gateway-Limit (65536 bytes)
    client_body_buffer_size 64k;
    proxy_buffer_size       8k;
    proxy_buffers           8 8k;

    # ── Upstream: 4 Gateway-Instanzen ────────────────────────────────────────
    upstream gateway_cluster {
        least_conn;     # Neue Requests → Instanz mit wenigsten aktiven Verbindungen
                        # Optimal für SaaS: viele Clients mit unterschiedlicher Last

        server gateway_1:8080 max_fails=3 fail_timeout=10s;
        server gateway_2:8080 max_fails=3 fail_timeout=10s;
        server gateway_3:8080 max_fails=3 fail_timeout=10s;
        server gateway_4:8080 max_fails=3 fail_timeout=10s;

        # Persistente Verbindungen zum Upstream (eliminiert Handshake-Overhead)
        keepalive     256;          # 64 pro Instanz bei 4 Instanzen
        keepalive_time    1h;
        keepalive_requests 10000;
    }

    # ── Server-Block ─────────────────────────────────────────────────────────
    server {
        listen 8090;
        server_name _;

        # ── Proxy-Header ─────────────────────────────────────────────────────
        proxy_http_version      1.1;
        proxy_set_header        Connection "";         # Keepalive zum Upstream
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout   2s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;

        # ── Log-Ingest Endpunkt — Rate Limiting aktiv ─────────────────────────
        location /api/v1/logs {
            limit_req zone=api_limit burst=1000 nodelay;
            proxy_pass http://gateway_cluster;
        }

        # ── Alle anderen Endpunkte ────────────────────────────────────────────
        # (health, metrics, costs, cache/stats)
        location / {
            proxy_pass http://gateway_cluster;
        }

        # ── Nginx eigener Health-Endpunkt (für externe Monitore) ──────────────
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
